spring.application.name=gter
server.servlet.context-path=/gter

spring.datasource.url=jdbc:h2:file:./data/gterdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Mantém o console do H2 ativo (opcional, mas recomendado)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Evita que o Hibernate apague/recrie as tabelas toda vez
spring.jpa.hibernate.ddl-auto=update